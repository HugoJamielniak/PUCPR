<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pacientes - MedFX</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter', sans-serif;
    background:#f4f7fb;
    color:#1e293b;
}

/* ================= TOPBAR ================= */

.topbar{
    width:100%;
    height:72px;
    background:#1565D8;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 35px;
    box-shadow:0 2px 15px rgba(0,0,0,0.08);
}

.logo{
    color:white;
    font-size:24px;
    font-weight:700;
}

.logo span{
    color:#9fd0ff;
}

.user{
    width:45px;
    height:45px;
    border-radius:50%;
    background:white;
    color:#1565D8;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
}

/* ================= LAYOUT ================= */

.layout{
    display:flex;
    min-height:calc(100vh - 72px);
}

/* ================= SIDEBAR ================= */

.sidebar{
    width:250px;
    background:white;
    padding:30px 20px;
    border-right:1px solid #e2e8f0;
}

.sidebar h3{
    font-size:13px;
    color:#94a3b8;
    margin-bottom:20px;
    text-transform:uppercase;
    letter-spacing:1px;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.menu a{
    text-decoration:none;
    color:#475569;
    padding:14px 16px;
    border-radius:14px;
    transition:.3s;
    font-weight:500;
}

.menu a:hover{
    background:#eff6ff;
    color:#1565D8;
}

.menu .active{
    background:#1565D8;
    color:white;
}

/* ================= CONTENT ================= */

.content{
    flex:1;
    padding:35px;
}

/* ================= HEADER ================= */

.page-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
    flex-wrap:wrap;
    gap:20px;
}

.page-header h1{
    font-size:34px;
    font-weight:700;
}

.page-header p{
    margin-top:8px;
    color:#64748b;
}

.btn-new{
    background:#1565D8;
    color:white;
    border:none;
    padding:15px 22px;
    border-radius:14px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.btn-new:hover{
    background:#0f4fb5;
}

/* ================= PATIENT GRID ================= */

.patient-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
    gap:25px;
}

/* ================= CARD ================= */

.patient-card{
    background:white;
    border-radius:24px;
    padding:28px;
    box-shadow:0 6px 20px rgba(0,0,0,0.05);
    transition:.3s;
}

.patient-card:hover{
    transform:translateY(-5px);
}

.patient-top{
    display:flex;
    align-items:center;
    gap:18px;
    margin-bottom:25px;
}

.avatar{
    width:70px;
    height:70px;
    border-radius:20px;
    background:#dbeafe;
    color:#1565D8;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:700;
}

.patient-info h2{
    font-size:20px;
    margin-bottom:5px;
}

.patient-info span{
    color:#64748b;
    font-size:14px;
}

/* ================= FORM ================= */

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    font-weight:600;
    color:#475569;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    padding:14px;
    border:1px solid #dbe2ea;
    border-radius:14px;
    background:#f8fafc;
    font-size:14px;
    outline:none;
    transition:.3s;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
    border-color:#1565D8;
    background:white;
}

textarea{
    resize:none;
    min-height:90px;
}

/* ================= BUTTONS ================= */

.actions{
    display:flex;
    gap:12px;
    margin-top:10px;
}

.save-btn{
    flex:1;
    background:#1565D8;
    color:white;
    border:none;
    padding:14px;
    border-radius:14px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.save-btn:hover{
    background:#0f4fb5;
}

.delete-btn{
    background:#fee2e2;
    color:#dc2626;
    border:none;
    padding:14px 18px;
    border-radius:14px;
    cursor:pointer;
    font-weight:600;
    transition:.3s;
}

.delete-btn:hover{
    background:#fecaca;
}

/* ================= RESPONSIVO ================= */

@media(max-width:950px){

    .layout{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
        border-right:none;
        border-bottom:1px solid #e2e8f0;
    }

    .content{
        padding:20px;
    }

}

</style>
</head>

<body>

<!-- ================= TOPBAR ================= -->

<header class="topbar">

    <div class="logo">
        Med<span>FX</span>
    </div>

    <div class="user">
        H
    </div>

</header>

<!-- ================= LAYOUT ================= -->

<div class="layout">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <h3>Menu</h3>

        <div class="menu">
            <a href="#">Dashboard</a>
            <a href="#" class="active">Pacientes</a>
            <a href="#">Avaliações</a>
            <a href="#">Relatórios</a>
            <a href="#">Configurações</a>
        </div>

    </aside>

    <!-- CONTENT -->

    <main class="content">

        <div class="page-header">

            <div>
                <h1>Pacientes</h1>
                <p>Gerencie e atualize os dados dos pacientes.</p>
            </div>

            <button class="btn-new">
                + Novo Paciente
            </button>

        </div>

        <!-- GRID -->

        <div class="patient-grid">

            <!-- CARD 1 -->

            <div class="patient-card">

                <div class="patient-top">

                    <div class="avatar">
                        JS
                    </div>

                    <div class="patient-info">
                        <h2>João Silva</h2>
                        <span>ID #2031</span>
                    </div>

                </div>

                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" value="João Silva">
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" value="joao@email.com">
                </div>

                <div class="form-group">
                    <label>Idade</label>
                    <input type="number" value="54">
                </div>

                <div class="form-group">
                    <label>Risco</label>

                    <select>
                        <option>Alto</option>
                        <option>Médio</option>
                        <option>Baixo</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Observações</label>

                    <textarea>
Paciente com sintomas respiratórios e febre persistente.
                    </textarea>
                </div>

                <div class="actions">

                    <button class="save-btn">
                        Salvar Alterações
                    </button>

                    <button class="delete-btn">
                        Excluir
                    </button>

                </div>

            </div>

            <!-- CARD 2 -->

            <div class="patient-card">

                <div class="patient-top">

                    <div class="avatar">
                        MC
                    </div>

                    <div class="patient-info">
                        <h2>Maria Costa</h2>
                        <span>ID #2032</span>
                    </div>

                </div>

                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" value="Maria Costa">
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" value="maria@email.com">
                </div>

                <div class="form-group">
                    <label>Idade</label>
                    <input type="number" value="29">
                </div>

                <div class="form-group">
                    <label>Risco</label>

                    <select>
                        <option>Médio</option>
                        <option>Alto</option>
                        <option>Baixo</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Observações</label>

                    <textarea>
Paciente em análise clínica por dores abdominais.
                    </textarea>
                </div>

                <div class="actions">

                    <button class="save-btn">
                        Salvar Alterações
                    </button>

                    <button class="delete-btn">
                        Excluir
                    </button>

                </div>

            </div>

        </div>

    </main>

</div>

</body>
</html>
